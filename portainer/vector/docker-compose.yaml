version: '3.8'

services:
  vector:
    image: timberio/vector:0.58.0-debian
    container_name: vector
    ports:
      - "8686:8686"
    volumes:
      # Connect to Docker engine
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # FIX: Uses the fresh folder name directly relative to this compose file
      - ./v_config/vector.yaml:/etc/vector/vector.yaml:ro
      
      # Stores logs in a fresh companion folder
      - ./v_logs:/var/log/vector
    restart: unless-stopped
