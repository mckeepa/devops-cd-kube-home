version: '3.8'

services:
  vector:
    image: timberio/vector:latest-alpine
    container_name: vector
    ports:
      - "8686:8686"
    volumes:
      # Mount the Docker socket to allow Vector to collect logs from other containers
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount your local vector configuration file from the host machine
      - /path/to/your/host/vector.yaml:/etc/vector/vector.yaml:ro
    restart: unless-stopped
