version: '3.8'

services:
  vector:
    image: timberio/vector:latest-alpine
    container_name: vector
    ports:
      - "8686:8686"
    # Overwrite Vector's default start command to look inside the mapped directory
    command: ["--config-dir", "/etc/vector/"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # FIX: Map the FOLDER instead of the file
      - ./config:/etc/vector:ro
      
      - ./logs:/var/log/vector
    restart: unless-stopped
