# vector.yaml - Log Aggregation Pipeline Configuration

api:
  enabled: true
  address: "0.0.0.0:8686"

# 1. SOURCES: Where to collect data from
sources:
  docker_containers:
    type: "docker_logs"
    # Exclude Vector's own logs so it doesn't infinitely process its own logging output
    exclude_containers:
      - "vector"

# 2. TRANSFORMS (Optional): Clean, filter, or restructure logs
transforms:
  parse_and_enrich:
    type: "remap"
    inputs:
      - "docker_containers"
    # VRL (Vector Remap Language) to structure data if it's JSON
    source: |
      # If the container log is a raw JSON string, parse it into structured fields
      if can_be_parsed_as_json(.message) {
        structured = parse_json!(.message)
        . = merge(., structured)
      }
      
      # Tag the log with an environment identifier
      .environment = "production"

# 3. SINKS: Where to store or send the data
sinks:
  # For local testing: Stores logs directly inside the Vector container's storage
  local_file_storage:
    type: "file"
    inputs:
      - "parse_and_enrich"
    compression: "none"
    path: "/var/log/vector/%Y-%m-%d-container-logs.log"
    encoding:
      codec: "json"

  # For troubleshooting: Prints the final log shape directly into Vector's container logs
  stdout_console:
    type: "console"
    inputs:
      - "parse_and_enrich"
    encoding:
      codec: "json"
